[package]
name = "ps-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui_material_icons = "0.9.0"
epaint_default_fonts = "0.37.0"
ps-core = { version = "0.2.0", path = "../ps-core" }
ps-io = { version = "0.2.0", path = "../ps-io" }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = "0.44.0"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }

[build-dependencies]
winresource = "0.1.34"

# Linux needs a windowing backend; macOS and Windows have theirs built in.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland"] }
