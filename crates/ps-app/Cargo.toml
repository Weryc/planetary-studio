[package]
name = "ps-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui_material_icons = "0.9.0"
epaint_default_fonts = "0.37.0"
ps-core = { version = "1.0.0", path = "../ps-core" }
ps-io = { version = "1.0.0", path = "../ps-io" }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = "0.44.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[build-dependencies]
winresource = "0.1.34"

# Linux needs a windowing backend; macOS and Windows have theirs built in.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland"] }
