[workspace]
resolver = "3"
members = ["crates/ps-core", "crates/ps-io", "crates/ps-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[profile.dev]
# Image loops are unusably slow without optimisation; keep debug info but optimise deps and our code.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
