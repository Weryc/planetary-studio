# Builds every package of a release on GitHub's own machines and attaches them to the release:
#   macOS   Apple Silicon, Intel and universal DMGs
#   Windows x64 zip (portable executable)
#   Linux   x86_64 AppImage and tar.gz
#
# Run by pushing a tag `vX.Y.Z` (the release is created with the notes in
# .github/release_notes/vX.Y.Z.md, or generated ones if that file is missing), or by hand with
# the tag of an existing release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the packages to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the DMGs
        run: |
          packaging/make_dmg.sh --apple-silicon
          packaging/make_dmg.sh --intel
          packaging/make_dmg.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dmg/*.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build the zip
        run: packaging/make_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/windows/*.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the AppImage and the tar.gz
        run: packaging/make_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/linux/*.tar.gz
            target/linux/*.AppImage

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l packages
          notes=".github/release_notes/${TAG}.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release create "$TAG" --title "Planetary Studio ${TAG#v}" --notes-file "$notes"
            else
              gh release create "$TAG" --title "Planetary Studio ${TAG#v}" --generate-notes
            fi
          fi
          gh release upload "$TAG" packages/* --clobber
